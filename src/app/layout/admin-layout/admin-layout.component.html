<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer class="sidenav" fixedInViewport
        [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
        [mode]="(isHandset$ | async) ? 'over' : 'side'"
        [opened]="(isHandset$ | async) === false">
      <mat-toolbar>SISTEM 404</mat-toolbar>
      <mat-nav-list>
        <a mat-list-item routerLink="/admin/reservations" *ngIf="authService.isAdmin()">Reservaciones</a>
        <a mat-list-item routerLink="/my-reservations" *ngIf="authService.isClient()">Mis Reservaciones</a>
        <a mat-list-item href="/customer-list">Clientes List</a>
        <a mat-list-item href="/customer-form">Clientes Form</a>
        <a mat-list-item href="#">Productos</a>
        <a mat-list-item href="#">Ventas</a>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <mat-toolbar color="primary">
        @if (isHandset$ | async) {
          <button
            type="button"
            aria-label="Toggle sidenav"
            mat-icon-button
            (click)="drawer.toggle()">
            <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
          </button>
        }
        <span>CLIENTES</span>
      </mat-toolbar>
      <!-- Add Content Here -->
       <router-outlet/>
    </mat-sidenav-content>
  </mat-sidenav-container>
