<h2>Detalles de la Reservación</h2>
<button mat-raised-button color="primary" (click)="openDetailDialog()">Agregar Detalle</button>
<table mat-table [dataSource]="details" class="mat-elevation-z8">
  <ng-container matColumnDef="numberPeople">
    <th mat-header-cell *matHeaderCellDef>N° Personas</th>
    <td mat-cell *matCellDef="let d">{{ d.numberPeople }}</td>
  </ng-container>
  <ng-container matColumnDef="reservationMethod">
    <th mat-header-cell *matHeaderCellDef>Método</th>
    <td mat-cell *matCellDef="let d">{{ d.reservationMethod }}</td>
  </ng-container>
  <ng-container matColumnDef="request">
    <th mat-header-cell *matHeaderCellDef>Petición</th>
    <td mat-cell *matCellDef="let d">{{ d.request }}</td>
  </ng-container>
  <ng-container matColumnDef="table">
    <th mat-header-cell *matHeaderCellDef>Mesa</th>
    <td mat-cell *matCellDef="let d">{{ d.table?.tableNumber }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let d">
      <ng-container *ngIf="d.state === 'A'; else restoreBtn">
        <button mat-icon-button color="accent" (click)="openDetailDialog(d)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="deleteDetail(d)"><mat-icon>delete</mat-icon></button>
      </ng-container>
      <ng-template #restoreBtn>
        <button mat-icon-button color="primary" (click)="restoreDetail(d)"><mat-icon>restore</mat-icon></button>
      </ng-template>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="['numberPeople', 'reservationMethod', 'request', 'table', 'actions']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['numberPeople', 'reservationMethod', 'request', 'table', 'actions'];" [class.inactive]="row.state === 'I'"></tr>
</table>
<div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
  <button mat-button (click)="close()">Cerrar</button>
</div>

<style>
  .inactive {
    opacity: 0.5;
    background: #f8d7da;
  }
</style>
