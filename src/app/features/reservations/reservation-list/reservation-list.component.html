<mat-card>
  <mat-card-header>
    <mat-card-title>Listado de Reservaciones</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="header-controls">
      <mat-form-field>
        <mat-label>Buscar reservación...</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej: Cena de Aniversario">
      </mat-form-field>
      <button mat-raised-button color="primary" (click)="openDialog()">Nueva Reservación</button>
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
      <!-- Name Column -->
      <ng-container matColumnDef="reservationName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let r">{{ r.reservationName }}</td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="reservationDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
        <td mat-cell *matCellDef="let r">{{ r.reservationDate | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="orderStatusType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
        <td mat-cell *matCellDef="let r">{{ r.orderStatusType?.name }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let r">
          <button mat-icon-button color="accent" (click)="openDialog(r)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="deleteReservation(r)"><mat-icon>delete</mat-icon></button>
          <button mat-icon-button color="primary" (click)="restoreReservation(r)" *ngIf="r.orderStatusType?.name === 'Cancelada'"><mat-icon>restore</mat-icon></button>
          <button mat-icon-button (click)="openDetails(r)"><mat-icon>list</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No se encontraron reservaciones.</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
