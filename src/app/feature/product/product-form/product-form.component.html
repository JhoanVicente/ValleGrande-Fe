<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <div>
    <label>Nombre:</label>
    <input formControlName="name" />
    <div *ngIf="productForm.get('name').invalid && productForm.get('name').touched">
      El nombre es obligatorio.
    </div>
  </div>

  <div>
    <label>Descripción:</label>
    <textarea formControlName="description"></textarea>
  </div>

  <div>
    <label>Precio:</label>
    <input type="number" formControlName="price" />
    <div *ngIf="productForm.get('price').invalid && productForm.get('price').touched">
      El precio es obligatorio y debe ser mayor a 0.
    </div>
  </div>

  <div>
    <label>URL Imagen:</label>
    <input formControlName="imageUrl" />
  </div>

  <div>
    <label>Categoría ID:</label>
    <input type="number" formControlName="categoryId" />
    <div *ngIf="productForm.get('categoryId').invalid && productForm.get('categoryId').touched">
      La categoría es obligatoria.
    </div>
  </div>

  <button type="submit" [disabled]="productForm.invalid">Guardar</button>
</form>
